name: twod-mcda

channels:
  - conda-forge

dependencies:
  - python=3.13
  - numpy
  - xarray
  - scipy
  - numba
  - matplotlib
  - seaborn
  - holoviews
  - hvplot
  - panel
  - bokeh
  - cartopy
  - jupyterlab
  - notebook
  - jupyter_bokeh
  - ipykernel
  # CALIOP products are HDF4 files, read through the netCDF4 engine. This
  # requires a libnetcdf built with HDF4 support, which is the case on
  # conda-forge but not in the netCDF4 wheels published on PyPI: installing
  # this environment with pip instead of conda would break reading.
  - netcdf4
  - libnetcdf
  - pyyaml
  - pip
  - pip:
      - cmlidar
